name: AIHOT 热点推送钉钉

on:
  schedule:
    # GitHub 用 UTC 时间。0 35 * * * = 北京时间每天 08:35
    - cron: "35 0 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 获取 AIHOT 内容并推送钉钉
        env:
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request

          WEBHOOK = os.environ.get("DINGTALK_WEBHOOK_URL", "").strip()
          if not WEBHOOK:
              raise SystemExit("未配置 DINGTALK_WEBHOOK_URL，请在 Settings > Secrets > Actions 中添加")

          def get_json(url):
              req = urllib.request.Request(url, headers={"User-Agent": "aihot-api/2.0.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def send(title, text):
              payload = {
                  "msgtype": "markdown",
                  "markdown": {"title": title, "text": text},
              }
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  WEBHOOK, data=data, headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(r.read().decode("utf-8"))

          # ---------- 1. 当前热点 Top10 ----------
          try:
              hot = get_json("https://aihot.news/api/v1/hot-topics")
              lines = ["## 🔥 AIHOT 热点 Top10\n"]
              for it in hot.get("items", [])[:10]:
                  rank = it.get("rank", "")
                  title = it.get("title", "")
                  url = (it.get("links") or {}).get("aihot", "")
                  lines.append(f"{rank}. [{title}]({url})")
              send("AIHOT 热点 Top10", "\n".join(lines))
          except Exception as e:
              print("热点获取失败:", e)

          # ---------- 2. 今日日报摘要 ----------
          try:
              daily = get_json("https://aihot.news/api/v1/dailies/latest")
              rep = daily.get("report", {})
              lead = rep.get("lead", {})
              date = rep.get("date", "")
              lines = [f"## 📰 AIHOT 热点日报 · {date}\n"]
              if lead.get("title"):
                  lines.append(f"### {lead['title']}\n")
              if lead.get("leadParagraph"):
                  lines.append(lead["leadParagraph"] + "\n")
              for sec in rep.get("sections", []):
                  label = sec.get("label", "")
                  items = sec.get("items", [])[:5]
                  if not items:
                      continue
                  lines.append(f"**【{label}】**")
                  for it in items:
                      t = it.get("title", "")
                      u = (it.get("links") or {}).get("aihot", "")
                      lines.append(f"- [{t}]({u})")
                  lines.append("")
              lines.append(f"\n[阅读完整日报]({rep.get('links', {}).get('aihot', 'https://aihot.news')})")
              send("AIHOT 热点日报", "\n".join(lines))
          except Exception as e:
              print("日报获取失败:", e)
          PY
